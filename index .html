  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F6F5FB; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  @keyframes bar1 { 0%,100% { height: 6px; } 50% { height: 22px; } }
  @keyframes bar2 { 0%,100% { height: 14px; } 50% { height: 26px; } }
  @keyframes bar3 { 0%,100% { height: 9px; } 50% { height: 18px; } }
  @keyframes rise { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform:none;} }
  @keyframes toastUp { from { opacity:0; transform: translateX(-50%) translateY(8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastDown { from { opacity:1; transform: translateX(-50%) translateY(0); } to { opacity:0; transform: translateX(-50%) translateY(8px); } }
  .row-in { animation: rise 0.28s ease both; }
  .panel-in { animation: fadeIn 0.18s ease both; }
  .sheet-in { animation: slideUp 0.22s ease both; }
  .toast-in { animation: toastUp 0.25s ease both; }
  .toast-out { animation: toastDown 0.25s ease both; opacity: 0; pointer-events: none; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  ::placeholder { color: #A9A5C2; }
  *:focus-visible { outline: 2px solid #818CF8; outline-offset: 2px; }
  .chip:hover, .quick:hover { border-color: #7C3AED !important; color: #7C3AED !important; }
  .fab:active { transform: scale(0.94); }
  @media (prefers-reduced-motion: reduce) {
    .row-in, .panel-in, .sheet-in, .toast-in, .toast-out { animation: none !important; }
  }
</style>
